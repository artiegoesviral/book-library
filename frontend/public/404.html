<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <script> const segmentCount = 1; const currentPath = window.location.pathname; const basePath = currentPath.split('/').slice(0, segmentCount + 1).join('/');

        const routePath = currentPath.slice(basePath.length); const redirectUrl = basePath + '/?/' + routePath + window.location.search + window.location.hash;

        window.location.replace(redirectUrl); </script>
</head>

<body> Redirecting... </body>

</html>
