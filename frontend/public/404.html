<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script> const segment = 1; const location = window.location; const base = location.pathname.split('/').slice(0, 1 + segment).join('/'); const route = location.pathname.slice(base.length); const redirect = base + '/?/' + route + location.search + location.hash; location.replace(redirect); </script>
</head>

<body> Redirecting... </body>

</html>
